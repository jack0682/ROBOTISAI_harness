project:
  name: ""
  description: ""
  status: "active"

# Where this project's actual materials live. Claude runs inside the harness
# repo; the workspace is outside it (default: the harness repo's parent).
workspace:
  root: ".."          # relative to the harness repo root (where CLAUDE.md lives)
  key_paths: []       # e.g. - src/  - data/raw/  - docs/spec.md
  notes: ""

harness:
  version: "0.3.0"

skills:
  required: []
  optional: []

# MCP servers this project expects (see kernel/tooling_protocol.md).
# Declare what must be configured; never assume an undeclared server exists.
mcp:
  required_servers: []   # e.g. - name: github / purpose: PR + issue access / fallback: gh CLI
  optional_servers: []
  notes: ""

protocols:
  default:
    - answering
    - planning
  additional: []

styles:
  default:
    - citation

constraints:
  allow_file_creation: false
  allow_file_deletion: false
  require_plan_before_edit: true
  require_checkpoint_for_long_task: true

# Validation evidence the stop gate demands (substring match against audited
# Bash commands). Empty list = the gate skips the validation check entirely.
# e.g. - pytest    - colcon build    - npm test
validation:
  commands: []

# What this environment can actually do. Verification machinery assumes you can
# run things; sometimes you physically cannot -- a target that only builds on
# other hardware, a system you can read but not execute. Without this the harness
# has only a false binary: demand execution evidence that cannot exist, or treat
# unverified work as fine.
#
#   verification_mode: execution     -- the stop gate wants a validation command
#                                       that ran and passed
#   verification_mode: analysis_only -- it wants an analytic verification instead,
#                                       and every claim carries its ceiling
#                                       (modes/verify.md)
environment:
  can_build: true
  can_run: true
  can_run_hardware: false
  verification_mode: execution

overrides:
  enabled: true
  files:
    - overrides/protocols.md
    - overrides/styles.md
    - overrides/commands.md
