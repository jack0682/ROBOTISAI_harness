# Index of domain governance scopes. Read-only reference (these ship with the harness).
# A scope owns local invariants, guardrails, and the verification it must perform,
# and routes into modes/, protocols/, and skills/. See scopes/<domain>/AGENTS.md.
scopes:
  - name: math
    path: scopes/math/AGENTS.md
    status: active
  - name: research
    path: scopes/research/AGENTS.md
    status: active
  - name: writing
    path: scopes/writing/AGENTS.md
    status: active
  - name: coding
    path: scopes/coding/AGENTS.md
    status: active
  - name: experiments
    path: scopes/experiments/AGENTS.md
    status: active
  - name: prompts
    path: scopes/prompts/AGENTS.md
    status: active
  - name: control
    path: scopes/control/AGENTS.md
    status: active
