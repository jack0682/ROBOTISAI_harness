# Skill registry.
#
# `status: archived` rows describe skills that are deliberately not in this
# tree. The archive was 988 of 1,770 tracked files and 26 MB of 41, duplicated
# across the two harnesses and referenced by nothing, so it lives on the
# `archive/retired-skills` branch instead of in every clone. The rows stay here
# because the record of what was retired -- and what superseded it -- is worth
# more than the files.
#
#   git restore --source=archive/retired-skills --worktree -- claude-harness/_archive
#
# restores it into the working tree only. Use --worktree, not a plain
# `git checkout <branch> -- <path>`: that stages the files too, and a staged
# file is not covered by .gitignore, so the restore itself would dirty the
# tree it was meant to keep clean.
# Index of skill modules. Updated by scripts/new_skill.py.
